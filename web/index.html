<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Онлайн-бронирование VR-клубов Effect VR и V-Ray">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Бронирование VR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Бронирование VR</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { height: 100%; margin: 0; background: #0A0F0D; }
  </style>
</head>
<body>
  <script>
    // Мост «виджет -> родительская страница» для встраивания через <iframe>
    // (сайт клуба, VK Mini Apps). Контракт сообщений — docs/EMBED.md.
    (function () {
      function send(msg) {
        try {
          if (window.parent !== window) window.parent.postMessage(msg, '*');
        } catch (e) {}
      }
      // Пока грузится Flutter — примерная высота, чтобы iframe не был нулевым.
      // Дальше точную высоту шлёт сам виджет (measure по контенту).
      window.addEventListener('load', function () {
        send({ type: 'vr-booking:height', height: 680 });
      });
      window.__vrBooking = { send: send };
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
