<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Онлайн-бронирование VR-клубов Effect VR и V-Ray">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!--
    CSP страницы. Здесь, а не только в заголовках сервера: конфиг хостинга
    (.htaccess / nginx) может не доехать, а meta работает всегда.
    frame-ancestors в meta игнорируется — он задаётся в web/_headers и .htaccess.

    'wasm-unsafe-eval' нужен CanvasKit; www.gstatic.com — его аварийный источник,
    если локальная папка canvaskit/ не доехала на хостинг.
    connect-src — Supabase (PostgREST/RPC напрямую) и Edge Function.

    fonts.gstatic.com: CanvasKit подтягивает оттуда Noto Sans для глифов,
    которых нет в шрифте виджета. С 2026-09-16 шрифт — Inter с кириллицей
    (tool/make_font.py), так что путь аварийный: домен из РФ доступен не
    всегда. Символы вне латиницы и кириллицы лучше не использовать вовсе
    (см. docs/AUDIT.md).
  -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self';
    script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval' https://www.gstatic.com;
    style-src 'self' 'unsafe-inline';
    img-src 'self' data: blob:;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' https://www.gstatic.com https://fonts.gstatic.com https://cpjmirlujtfuzvdnysyx.supabase.co https://cpjmirlujtfuzvdnysyx.functions.supabase.co wss://cpjmirlujtfuzvdnysyx.supabase.co;
    worker-src 'self' blob:;
    object-src 'none';
    base-uri 'self';
    form-action 'none';
  ">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#08090A">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Бронирование VR">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Бронирование VR</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Совпадает с BookingColors.bg — иначе при загрузке видна чужая подложка. */
    html, body { height: 100%; margin: 0; background: #08090A; }

    /* Заставка на время загрузки движка: без неё клиент несколько секунд
       смотрит в пустой тёмный прямоугольник и решает, что сайт сломан.
       Снимается по событию flutter-first-frame. */
    #boot {
      position: fixed; inset: 0; display: flex; align-items: center;
      justify-content: center; background: #08090A;
      font: 500 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: #8A8A96; transition: opacity .25s ease;
    }
    #boot.hide { opacity: 0; pointer-events: none; }
    #boot .card {
      width: min(420px, calc(100% - 32px)); padding: 26px 22px;
      border: 1px solid #26262E; border-radius: 22px; background: #101015;
      text-align: center;
    }
    #boot .bar {
      height: 6px; margin-top: 16px; border-radius: 999px;
      background: #1B1B22; overflow: hidden;
    }
    #boot .bar i {
      display: block; height: 100%; width: 40%; border-radius: 999px;
      background: #A9F04A; animation: boot-slide 1.1s ease-in-out infinite;
    }
    @keyframes boot-slide {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot .bar i { animation: none; width: 100%; opacity: .5; }
    }
  </style>
</head>
<body>
  <div id="boot">
    <div class="card">
      Загружаем бронирование…
      <div class="bar"><i></i></div>
    </div>
  </div>
  <script>
    // Первый кадр Flutter — убираем заставку.
    window.addEventListener('flutter-first-frame', function () {
      var b = document.getElementById('boot');
      if (!b) return;
      b.classList.add('hide');
      setTimeout(function () { b.remove(); }, 300);
    });
  </script>
  <script>
    // Мост «виджет -> родительская страница» для встраивания через <iframe>
    // (сайт клуба, VK Mini Apps). Контракт сообщений — docs/EMBED.md.
    (function () {
      function send(msg) {
        try {
          if (window.parent !== window) window.parent.postMessage(msg, '*');
        } catch (e) {}
      }
      // Пока грузится Flutter — примерная высота, чтобы iframe не был нулевым.
      // Дальше точную высоту шлёт сам виджет (measure по контенту).
      window.addEventListener('load', function () {
        send({ type: 'vr-booking:height', height: 680 });
      });
      window.__vrBooking = { send: send };
    })();
  </script>
  <script>
    // CanvasKit — самый тяжёлый файл (2–3 МБ). Штатно движок берётся за него
    // только после main.dart.js; подсказка браузеру качает их параллельно.
    // Вариант chromium меньше и грузится в браузерах на Chromium, поэтому
    // выбираем тот же файл, что возьмёт сам движок.
    (function () {
      // Тот же признак, что и у движка: браузеры на Chromium берут вариант
      // chromium. Ошибиться нельзя — это лишние мегабайты мимо кэша.
      var chromium = /Chrome\/|Chromium\/|CriOS\/|Edg\//.test(navigator.userAgent);
      var href = chromium ? 'canvaskit/chromium/canvaskit.wasm' : 'canvaskit/canvaskit.wasm';
      var l = document.createElement('link');
      l.rel = 'preload';
      l.as = 'fetch';
      l.type = 'application/wasm';
      l.crossOrigin = 'anonymous';
      l.href = href;
      document.head.appendChild(l);
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
